name: Deploy Curator

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: curator-production
  cancel-in-progress: false

env:
  DOKPLOY_APPLICATION_ID: RLseGyHGwxQNSXWOdLB_G

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm test
      # Type-checks and builds without touching PM2 or a .env file.
      - run: npm run build:ci

  deploy:
    name: Deploy to Dokploy
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://curatorfrc.com
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
    steps:
      - name: Check Dokploy credentials
        id: creds
        run: |
          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "::warning::DOKPLOY_URL / DOKPLOY_API_KEY secrets are not set; skipping the API deploy. Dokploy auto-deploy (if enabled) still builds this commit."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Dokploy deploy
        if: steps.creds.outputs.ready == 'true'
        run: |
          curl -fsS -X POST "$DOKPLOY_URL/api/application.deploy" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"applicationId\":\"$DOKPLOY_APPLICATION_ID\",\"title\":\"${GITHUB_SHA::7} via GitHub Actions\"}"
          echo "Deploy requested for ${GITHUB_SHA::7}"

      - name: Wait for Dokploy deployment result
        if: steps.creds.outputs.ready == 'true'
        run: |
          # Give Dokploy a moment to register the new deployment, then poll the latest one.
          sleep 15
          for i in $(seq 1 60); do
            status=$(curl -fsS "$DOKPLOY_URL/api/application.one?applicationId=$DOKPLOY_APPLICATION_ID" \
              -H "x-api-key: $DOKPLOY_API_KEY" \
              | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const d=(JSON.parse(s).deployments||[]).slice().sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))[0];console.log(d?d.status:"unknown")})')
            echo "[$i/60] latest deployment status: $status"
            case "$status" in
              done) exit 0 ;;
              error) echo "::error::Dokploy deployment failed; see the deployment log in Dokploy."; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Dokploy deployment."
          exit 1
